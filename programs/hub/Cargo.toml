[package]
name = "hub"
version = "1.0.0"
description = "$HUB Yield Optimizer Protocol — Activate-to-earn Boosted Yield layer for OTC desk NFTs on Solana"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]
name = "hub"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Devnet/localnet integration testing only. Swaps `constants::JUPITER_PROGRAM_ID` from the real
# Jupiter v6 aggregator to `mock_jupiter`'s program id (see programs/mock_jupiter). Never enabled
# in the reproducible build (`scripts/verify-build.sh`, `.github/workflows/verify.yml`) or any
# mainnet-beta deploy — the mainnet program must only ever CPI into real Jupiter.
mock-jupiter = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-security-txt = "1.1.3"
solana-sha256-hasher = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
