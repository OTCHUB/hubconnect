[toolchain]
anchor_version = "1.2.0"
solana_version = "4.2.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
hub = "DPEioLagahMiVy4xfSzeKLWjWho8GZhbvK85BgTkY8qW"

[programs.devnet]
hub = "DPEioLagahMiVy4xfSzeKLWjWho8GZhbvK85BgTkY8qW"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/hubconnect-devnet.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Anchor 1.x defaults `anchor test` to surfpool; this suite runs on solana-test-validator so the
# devnet clones below apply. Run `anchor test --validator legacy` (or set
# ANCHOR_TEST_VALIDATOR=legacy).
[test]
startup_wait = 20000

# Localnet clones Metaplex Core from devnet so desk-asset ownership checks run against the
# real program (§B5.1). Set HELIUS_API_KEY in .env to use Helius for the clone source.
[test.validator]
url = "https://api.devnet.solana.com"

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"

# mpl-core ProgramData (upgradeable loader); without it the cloned program is "closed".
[[test.validator.clone]]
address = "9ZC25KLUrfgSoFVgjE1rrydZBbZns58UXi8A8ZhTdGfr"
