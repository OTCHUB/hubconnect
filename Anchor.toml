[toolchain]
anchor_version = "1.2.0"
solana_version = "4.2.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
hub = "7c5oPs9GvX8vrC5jVFketNx1ZLuPs7HeH8Qc4XJx7b7i"

[programs.mainnet]
hub = "7c5oPs9GvX8vrC5jVFketNx1ZLuPs7HeH8Qc4XJx7b7i"

[programs.localnet]
hub = "7c5oPs9GvX8vrC5jVFketNx1ZLuPs7HeH8Qc4XJx7b7i"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/hubconnect-devnet.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[hooks]

[test]
startup_wait = 20000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
# Forked from mainnet-beta (not devnet): Jupiter v6 and the OTC/Metaplex Core accounts below only
# exist on mainnet-beta — see docs/hubconnect-spec.md and the m2-yield Jupiter CPI notes. A
# devnet fork cannot resolve JUPITER_PROGRAM_ID (confirmed empty/System-owned on devnet).
url = "https://api.mainnet-beta.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"

[[test.validator.clone]]
address = "9ZC25KLUrfgSoFVgjE1rrydZBbZns58UXi8A8ZhTdGfr"

# Jupiter Aggregator v6 — required for the finalize_epoch / activate_tier_otc / upgrade_tier_otc
# synchronous swap CPI. Real bytecode/account layout; still needs a liquid route to actually swap
# (see jupiter_swap.rs doc comment — $HUB has no pool yet, so only liquid pairs like SOL/USDC can
# exercise this end-to-end today).
[[test.validator.clone]]
address = "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"
