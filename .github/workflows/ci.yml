name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  SOLANA_VERSION: 4.2.2
  ANCHOR_VERSION: 1.2.0
  RUST_VERSION: 1.98.1
  NODE_VERSION: 22

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  anchor:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Solana (Agave)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/solana-foundation/anchor --tag v${ANCHOR_VERSION} avm --force
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/hubconnect-devnet.json
      # `npm test` builds `hub` twice — the default (mainnet) build and a second pass with the
      # `mock-jupiter` Cargo feature — before running `anchor test`, since the M2/M3 suites drive
      # `finalize_epoch`'s synchronous Jupiter CPI leg against the mock program on localnet.
      - run: npm test
